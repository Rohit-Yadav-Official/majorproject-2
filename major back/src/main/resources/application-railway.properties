# Railway Production Configuration
# PostgreSQL Database (Railway provides this)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Database Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# Blockchain Configuration (Sepolia Testnet)
blockchain.rpc.url=${BLOCKCHAIN_RPC_URL:https://sepolia.infura.io/v3/YOUR_INFURA_PROJECT_ID}
blockchain.contract.address=${BLOCKCHAIN_CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}
blockchain.private.key=${BLOCKCHAIN_PRIVATE_KEY:}
blockchain.chain.id=${BLOCKCHAIN_CHAIN_ID:11155111}
blockchain.network.name=sepolia

# Server Configuration
server.port=${PORT:8080}

# CORS Configuration for Frontend
spring.web.cors.allowed-origins=${FRONTEND_URL:https://your-app.vercel.app}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Health Check Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# Logging Configuration
logging.level.com.carbontax=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Application Information
info.app.name=Carbon Tax Blockchain System
info.app.description=Transparent carbon tax management using blockchain
info.app.version=1.0.0
