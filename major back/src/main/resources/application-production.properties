# Production Configuration for Free Deployment
# Railway PostgreSQL Database (FREE)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Blockchain Configuration (Sepolia Testnet - FREE)
blockchain.rpc.url=${BLOCKCHAIN_RPC_URL:https://sepolia.infura.io/v3/YOUR_INFURA_PROJECT_ID}
blockchain.contract.address=${BLOCKCHAIN_CONTRACT_ADDRESS}
blockchain.private.key=${BLOCKCHAIN_PRIVATE_KEY}
blockchain.chain.id=${BLOCKCHAIN_CHAIN_ID:11155111}

# CORS Configuration for Frontend
cors.allowed.origins=${FRONTEND_URL:https://your-app.vercel.app}
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*

# Security Configuration
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}
spring.security.user.roles=ADMIN

# Logging Configuration
logging.level.com.carbontax=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Health Check Endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Application Information
info.app.name=Carbon Tax Blockchain System
info.app.description=Transparent carbon tax management using blockchain
info.app.version=1.0.0
info.app.contact.email=support@carbontax.com
